<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StayEasy — Hotels & Vacation Rentals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP BAR -->
  <header>
    <h1>🏝️ StayEasy</h1>
    <button id="my-booking-btn" class="link-btn">Find my booking</button>
  </header>

  <!-- SEARCH FORM -->
  <section class="hero">
    <h2>Find your perfect stay</h2>
    <form id="search-form">
      <label>Where to?   <input id="city" placeholder="e.g. Goa"></label>
      <label>Type
        <select id="type">
          <option value="">Hotels & rentals</option>
          <option value="hotel">Hotels</option>
          <option value="rental">Vacation rentals</option>
        </select>
      </label>
      <label>Check-in  <input id="checkIn"  type="date"></label>
      <label>Check-out <input id="checkOut" type="date"></label>
      <label>Guests    <input id="guests" type="number" min="1" value="2"></label>
      <button type="submit">Search</button>
    </form>
    <p id="search-error" class="error"></p>
  </section>

  <!-- RESULTS -->
  <main>
    <p id="result-count"></p>
    <div id="results" class="grid"></div>
  </main>

  <!-- POP-UP WINDOW (used for booking and for looking up bookings) -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="modal-close" class="close" aria-label="Close">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
