<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StayEasy — Host area</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="logo"><span class="logo-mark">S</span>StayEasy <span class="muted" style="font-weight:600">· Hosts</span></a>
      <a href="index.html" class="btn btn-ghost btn-sm">Back to site</a>
    </div>
  </header>

  <main class="page">
    <!-- Step 1: password -->
    <section id="login" class="card-box">
      <h2>Host login</h2>
      <form id="login-form">
        <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
        <p class="error" id="login-error" role="alert"></p>
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>
    </section>

    <!-- Step 2: shown after login -->
    <section id="panel" class="hidden">
      <h2>Bookings <span id="bookings-count" class="muted"></span></h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Code</th><th>Place</th><th>Guest</th><th>Phone</th><th>Email</th>
                <th>Check-in</th><th>Check-out</th><th>Guests</th><th>Total</th><th>Status</th></tr>
          </thead>
          <tbody id="bookings"></tbody>
        </table>
      </div>

      <h2>Add a place</h2>
      <form id="add-form" class="card-box add-form">
        <label>Name <input name="name" required></label>
        <label>Type
          <select name="type">
            <option value="hotel">Hotel</option>
            <option value="rental">Holiday home</option>
          </select>
        </label>
        <label>City <input name="city" list="host-cities" required></label>
        <datalist id="host-cities">
          <option value="Goa"></option><option value="Manali"></option><option value="Udaipur"></option>
          <option value="Jaipur"></option><option value="Kochi"></option><option value="Munnar"></option>
          <option value="Mumbai"></option><option value="Bengaluru"></option><option value="Shimla"></option>
        </datalist>
        <label>Description <input name="description" required></label>
        <label>Price per night (₹) <input name="price_per_night" type="number" min="1" required></label>
        <label>Max guests <input name="max_guests" type="number" min="1" required></label>
        <label>Bedrooms <input name="bedrooms" type="number" min="0" required></label>
        <label>Amenities <span class="hint">Separate with commas, e.g. Wi-Fi, Pool, Breakfast</span>
          <input name="amenities" placeholder="Wi-Fi, AC, Parking"></label>
        <label>Photo link (optional) <span class="hint">A web address starting with https:// . Without one, we show an illustration of the city.</span>
          <input name="image_url" type="url" placeholder="https://..."></label>
        <button type="submit" class="btn btn-primary">Add place</button>
        <p id="add-msg" class="muted"></p>
      </form>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
