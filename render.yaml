# render.yaml — instructions for the Render hosting service.
services:
  - type: web
    name: stayeasy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_PASSWORD      # the host's password. Set the real value in Render's dashboard.
        sync: false
